<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Fee - Smart Hostel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .fee-form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
        }

        .fee-form label {
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .fee-form select,
        .fee-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
        }

        .fee-form button {
            margin-top: 20px;
            padding: 12px 25px;
            width: fit-content;
            cursor: pointer;
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">
        <h1>Add Fee</h1>
        <p>Add Student Fee Information</p>
    </header>

    <div class="card">

        <h2>Fee Details</h2>

        <form
            action="/add_fee"
            method="POST"
            class="fee-form"
            id="feeForm"
        >

            <!-- Student -->
            <label for="student_id">Select Student</label>

            <select id="student_id" name="student_id">

                <option value="">Select Student</option>

                {% for student in students %}

                <option value="{{ student.id }}">
                    {{ student.name }} - Room {{ student.room_number }}
                </option>

                {% endfor %}

            </select>


            <!-- Amount -->
            <label for="amount">Fee Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Enter fee amount"
                min="0"
            >


            <!-- Status -->
            <label for="status">Fee Status</label>

            <select id="status" name="status">

                <option value="">Select Status</option>

                <option value="Paid">Paid</option>

                <option value="Pending">Pending</option>

            </select>


            <!-- Submit -->
            <button type="submit">
                Add Fee
            </button>

        </form>

        <a href="/fees" class="back-button">
            Back to Fees
        </a>

    </div>

</div>


<!-- JavaScript -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
