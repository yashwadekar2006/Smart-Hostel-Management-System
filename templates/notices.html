<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notice Management - Smart Hostel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .notice-container {
            width: 95%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .notice-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        .notice-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .notice-form {
            display: flex;
            flex-direction: column;
            max-width: 700px;
        }

        .notice-form label {
            margin-top: 12px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .notice-form input,
        .notice-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
        }

        .notice-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-button {
            margin-top: 20px;
            padding: 12px 25px;
            width: fit-content;
            cursor: pointer;
            font-size: 16px;
        }

        .notice-table {
            width: 100%;
            border-collapse: collapse;
        }

        .notice-table th,
        .notice-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .notice-table th {
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            margin-top: 5px;
            padding: 10px 20px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">

        <h1>Notice Management</h1>

        <p>Manage Hostel Notices and Announcements</p>

    </header>


    <div class="notice-container">


        <!-- Add Notice -->

        <div class="notice-card">

            <h2>Add Notice</h2>

            <form
                action="/add_notice"
                method="POST"
                class="notice-form"
                id="noticeForm"
            >

                <label for="title">
                    Notice Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter notice title"
                    required
                >


                <label for="notice_text">
                    Notice / Announcement
                </label>

                <textarea
                    id="notice_text"
                    name="notice_text"
                    placeholder="Type your notice here..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Submit Notice
                </button>

            </form>

        </div>


        <!-- Notice List -->

        <div class="notice-card">

            <h2>Hostel Notices</h2>

            <div style="overflow-x:auto;">

                <table class="notice-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Notice Title</th>
                            <th>Notice / Announcement</th>
                        </tr>

                    </thead>


                    <tbody>

                        {% for notice in notices %}

                        <tr>

                            <td>
                                {{ notice.id }}
                            </td>

                            <td>
                                {{ notice.title }}
                            </td>

                            <td>
                                {{ notice.notice_text }}
                            </td>

                        </tr>

                        {% else %}

                        <tr>

                            <td colspan="3">
                                No notices found.
                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>


        <a href="/login"
           class="back-button">
            Back
        </a>


    </div>

</div>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
