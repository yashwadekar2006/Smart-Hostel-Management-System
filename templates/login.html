<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Hostel Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FCE4EC;
        }


        /* Main Container */

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 35px 20px;
        }


        /* Login Card */

        .login-card {
            width: 100%;
            max-width: 480px;

            background: #ffffff;

            border-radius: 22px;

            overflow: hidden;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);

            margin-top: 5px;
        }


        /* Header */

        


    .login-header {
    background: #FCE4EC;
    color: #374151;
    text-align: center;
    padding: 0;
    position: relative;
}

.login-header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 700;
}

.login-header p {
    margin: 8px 0 0;
    font-size: 19px;
    color: #64748B;
}


/* Login Body */

.login-body {
    padding: 20px 35px 35px;
    margin-top: 0;
}

.login-body h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
    color: #374151;
    font-size: 17px;
    font-weight: 600;
}    

    
       

        /* Form */

        .login-form {
            display: flex;

            flex-direction: column;
        }


        .login-form label {
            margin-bottom: 7px;

            margin-top: 15px;

            font-weight: 600;

            color: #374151;

            font-size: 17px;
        }


        .login-form input {
            width: 100%;

            padding: 13px;

            border: 1px solid #CBD5E1;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }


        .login-form input:focus {
            border-color: #66BFA3;

            box-shadow: 0 0 0 2px rgba(102, 191, 163, 0.15);
        }


        /* Login Button */

        .login-form button {
            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #66BFA3;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;
        }


        .login-form button:hover {
            background: #4FA88C;
        }


        /* Footer */

        .login-footer {
            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 13px;
        }


        /* Mobile */

        @media (max-width: 500px) {

            .login-container {
                padding: 25px 15px;
            }

            .login-header h1 {
                font-size: 30px;
            }

            .login-header p {
                font-size: 16px;
            }

            .login-body {
                padding: 25px;

                margin-top: 45px;
            }

            .login-body h2 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <!-- Header -->

        <div class="login-header">

            <h1>
                Smart Hostel
            </h1>

            <p>
                Hostel Management System
            </p>

        </div>


        <!-- Login Body -->

        <div class="login-body">

            <h2>
                Admin Login
            </h2>


            <form
                action="/login"
                method="POST"
                id="loginForm"
                class="login-form"
            >


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >


                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                >


                <!-- Login -->

                <button type="submit">
                    Login
                </button>


            </form>


            <div class="login-footer">

                Smart Hostel Management System

            </div>

        </div>


    </div>


</div>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
