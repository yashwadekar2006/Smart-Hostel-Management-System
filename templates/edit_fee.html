<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Fee - Smart Hostel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .fee-form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
        }

        .fee-form label {
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .fee-form input,
        .fee-form select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
        }

        .fee-form button {
            margin-top: 20px;
            padding: 12px 25px;
            width: fit-content;
            cursor: pointer;
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">
        <h1>Edit Fee</h1>
        <p>Update Student Fee Information</p>
    </header>

    <div class="card">

        <h2>Update Fee</h2>

        <form action="/update_fee/{{ fee.id }}"
              method="POST"
              class="fee-form">

            <label for="amount">Fee Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                value="{{ fee.amount }}"
                min="0"
                required
            >


            <label for="status">Fee Status</label>

            <select id="status" name="status" required>

                <option value="Paid"
                    {% if fee.status == "Paid" %}selected{% endif %}>
                    Paid
                </option>

                <option value="Pending"
                    {% if fee.status == "Pending" %}selected{% endif %}>
                    Pending
                </option>

            </select>


            <button type="submit">
                Update Fee
            </button>

        </form>

        <a href="/fees" class="back-button">
            Back to Fees
        </a>

    </div>

</div>

</body>

</html>
