<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - Smart Hostel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FCE4EC;
            color: #374151;
        }

        .dashboard {
            min-height: 100vh;
            padding: 30px;
        }

        /* Header */

        .dashboard-header {
            background: #DFF5E1;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
        }

        .dashboard-header h1 {
            margin: 0;
            font-size: 32px;
            color: #374151;
        }

        .dashboard-header p {
            margin: 8px 0 0;
            color: #64748B;
            font-size: 16px;
        }

        /* Cards */

        .dashboard-cards {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;

            display: flex;
            flex-wrap: wrap;
            gap: 22px;
        }

        .card {
            width: calc((100% - 44px) / 3);

            background: #FFFFFF;

            border: 1px solid #E6F2E8;
            border-radius: 16px;

            padding: 25px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);

            transition: 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);

            box-shadow: 0 9px 20px rgba(0, 0, 0, 0.10);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 10px;

            color: #374151;
            font-size: 21px;
        }

        .card p {
            color: #6B7280;
            margin-bottom: 20px;
            min-height: 40px;
        }

        /* Buttons */

        .card a {
            text-decoration: none;
        }

        .card button {
            background: #66BFA3;

            color: white;

            border: none;
            border-radius: 8px;

            padding: 11px 22px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .card button:hover {
            background: #4FA88C;
        }

        /* Logout */

        .logout-section {
            text-align: center;
            margin-top: 30px;
        }

        .logout-button {
            display: inline-block;

            padding: 11px 25px;

            background: #F8B4C4;
            color: #374151;

            text-decoration: none;

            border-radius: 8px;

            font-weight: 600;
        }

        .logout-button:hover {
            background: #F49AAF;
        }

        /* Tablet */

        @media (max-width: 900px) {

            .card {
                width: calc((100% - 22px) / 2);
            }

        }

        /* Mobile */

        @media (max-width: 600px) {

            .dashboard {
                padding: 15px;
            }

            .dashboard-header {
                padding: 22px 15px;
            }

            .dashboard-header h1 {
                font-size: 26px;
            }

            .card {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="dashboard">


    <!-- Header -->

    <header class="dashboard-header">

        <h1>
            Smart Hostel
        </h1>

        <p>
            Student Dashboard
        </p>

    </header>


    <!-- Dashboard Cards -->

    <div class="dashboard-cards">


        <!-- Profile -->

        <div class="card">

            <h2>
                My Profile
            </h2>

            <p>
                View your personal information
            </p>

            <a href="/student_profile">

                <button type="button">
                    View Profile
                </button>

            </a>

        </div>


        <!-- Room -->

        <div class="card">

            <h2>
                My Room
            </h2>

            <p>
                View your room information
            </p>

            <a href="/student_room">

                <button type="button">
                    View Room
                </button>

            </a>

        </div>


        <!-- Fees -->

        <div class="card">

            <h2>
                My Fees
            </h2>

            <p>
                Check your hostel fee status
            </p>

            <a href="/student_fees">

                <button type="button">
                    View Fees
                </button>

            </a>

        </div>


        <!-- Complaint -->

        <div class="card">

            <h2>
                Complaint
            </h2>

            <p>
                Submit a hostel complaint
            </p>

            <a href="/student_complaint">

                <button type="button">
                    Submit Complaint
                </button>

            </a>

        </div>


        <!-- Leave -->

        <div class="card">

            <h2>
                Leave Request
            </h2>

            <p>
                Submit your leave request
            </p>

            <a href="/student_leave">

                <button type="button">
                    Request Leave
                </button>

            </a>

        </div>


        <!-- Notices -->

        <div class="card">

            <h2>
                Notices
            </h2>

            <p>
                View hostel notices
            </p>

            <a href="/student_notices">

                <button type="button">
                    View Notices
                </button>

            </a>

        </div>


    </div>


    <!-- Logout -->

    <div class="logout-section">

        <a
            href="/login"
            class="logout-button"
        >
            Logout
        </a>

    </div>


</div>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
