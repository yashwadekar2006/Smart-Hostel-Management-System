<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Smart Hostel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FCE4EC;
            color: #374151;
        }

        .dashboard {
            min-height: 100vh;
            padding: 30px;
        }

        /* Header */

        .dashboard-header {
            background: #DFF5E1;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
        }

        .dashboard-header h1 {
            margin: 0;
            font-size: 32px;
            color: #374151;
        }

        .dashboard-header p {
            margin: 8px 0 0;
            color: #64748B;
            font-size: 16px;
        }

        /* Dashboard Cards */

        .dashboard-cards {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        /* Card */

        .dashboard-cards .card {
            background: #FFFFFF;

            border: 1px solid #E6F2E8;
            border-radius: 16px;

            padding: 25px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);

            transition: 0.2s ease;
        }

        .dashboard-cards .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 9px 20px rgba(0, 0, 0, 0.10);
        }

        .dashboard-cards .card h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #374151;
        }

        .dashboard-cards .card p {
            color: #6B7280;
            margin-bottom: 20px;
        }

        /* Button */

        .dashboard-cards .card button {
            background: #66BFA3;
            color: white;

            border: none;
            border-radius: 8px;

            padding: 11px 22px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .dashboard-cards .card button:hover {
            background: #4FA88C;
        }

        .dashboard-cards .card a {
            text-decoration: none;
        }

        /* Tablet */

        @media (max-width: 900px) {

            .dashboard-cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Mobile */

        @media (max-width: 600px) {

            .dashboard {
                padding: 15px;
            }

            .dashboard-header {
                padding: 22px 15px;
            }

            .dashboard-header h1 {
                font-size: 25px;
            }

            .dashboard-cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="dashboard">


    <!-- Header -->

    <header class="dashboard-header">

        <h1>
            Smart Hostel Management
        </h1>

        <p>
            Admin Dashboard
        </p>

    </header>


    <!-- Dashboard Cards -->

    <div class="dashboard-cards">


        <!-- Students -->

        <div class="card">

            <h2>Students</h2>

            <p>
                Manage hostel students
            </p>

            <a href="/students">

                <button type="button">
                    View Students
                </button>

            </a>

        </div>


        <!-- Rooms -->

        <div class="card">

            <h2>Rooms</h2>

            <p>
                Manage hostel rooms
            </p>

            <a href="/room_status">

                <button type="button">
                    View Rooms
                </button>

            </a>

        </div>


        <!-- Fees -->

        <div class="card">

            <h2>Fees</h2>

            <p>
                Manage student fees
            </p>

            <a href="/fees">

                <button type="button">
                    View Fees
                </button>

            </a>

        </div>


        <!-- Complaints -->

        <div class="card">

            <h2>Complaints</h2>

            <p>
                Manage student complaints
            </p>

            <a href="/complaints">

                <button type="button">
                    View Complaints
                </button>

            </a>

        </div>


        <!-- Leave Requests -->

        <div class="card">

            <h2>Leave Requests</h2>

            <p>
                Manage student leave requests
            </p>

            <a href="/leave_requests">

                <button type="button">
                    View Leave Requests
                </button>

            </a>

        </div>


        <!-- Notices -->

        <div class="card">

            <h2>Notices</h2>

            <p>
                Manage hostel notices
            </p>

            <a href="/notices">

                <button type="button">
                    View Notices
                </button>

            </a>

        </div>


    </div>

</div>


<!-- JavaScript -->

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
